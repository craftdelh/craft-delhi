<!DOCTYPE html>
<html>
<body>
    <button id="rzp-button1">Pay 500 INR</button>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
    document.getElementById('rzp-button1').onclick = async function(e){
        // 1. Create order on your backend
        const response = await fetch('http://localhost:5000/api/order/razorpay/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NjUsInJvbGUiOjMsIm5hbWUiOiJKYXogIEsiLCJpYXQiOjE3Nzc3MDk2NzMsImV4cCI6MTc3ODMxNDQ3M30.V1bbqyVlwhm3w2AIYDWq1931PFKzLV-haHxhTXCOeRY' },
            body: JSON.stringify({ amount: 500 })
        });
        const orderData = await response.json();

        // 2. Open Razorpay Modal
        var options = {
            "key": "rzp_test_SffBmT4u9Kpr3j", 
            "amount": orderData.data.amount,
            "currency": "INR",
            "name": "Craft Delhi",
            "order_id": orderData.data.id,
            "handler": async function (response){
                // 3. Verify on your backend
                const verifyRes = await fetch('http://localhost:5000/api/order/razorpay/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NjUsInJvbGUiOjMsIm5hbWUiOiJKYXogIEsiLCJpYXQiOjE3Nzc3MDk2NzMsImV4cCI6MTc3ODMxNDQ3M30.V1bbqyVlwhm3w2AIYDWq1931PFKzLV-haHxhTXCOeRY' },
                    body: JSON.stringify({
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature,
                        orderDetails: {
                            total_amount: 500,
                            shipping_address_id: 1, // Change to valid ID
                            items: [{ product_id: 1, quantity: 1, price: 500, seller_id: 1 }],
                            buyer_note: "Test Order"
                        }
                    })
                });
                const result = await verifyRes.json();
                alert(result.message);
            }
        };
        var rzp1 = new Razorpay(options);
        rzp1.open();
    }
    </script>
</body>
</html>
